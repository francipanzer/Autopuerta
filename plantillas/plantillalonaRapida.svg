<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="600" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#0f172a">PEDIDO DE PRECIO — LONA PUERTA RÁPIDA (estilo BMP)</text>
  <text x="20" y="50" font-size="11" fill="#64748b">Rellenar todas las medidas en mm. Una hoja por puerta.</text>

  <!-- Cliente / referencia -->
  <text x="20" y="80" font-size="12" fill="#0f172a">CLIENTE:</text>
  <rect x="90" y="66" width="200" height="20" fill="#eef6ff" stroke="#0284c7"/>
  <text x="310" y="80" font-size="12" fill="#0f172a">REF. / UBICACIÓN:</text>
  <rect x="420" y="66" width="160" height="20" fill="#eef6ff" stroke="#0284c7"/>
  <text x="20" y="110" font-size="12" fill="#0f172a">FECHA:</text>
  <rect x="90" y="96" width="120" height="20" fill="#eef6ff" stroke="#0284c7"/>

  <!-- Dibujo puerta rápida -->
  <rect x="150" y="130" width="300" height="240" fill="none" stroke="#0f172a" stroke-width="3"/>
  <!-- Lona -->
  <path d="M 160 150 L 440 150 L 440 350 Q 390 344 350 350 Q 300 356 250 350 Q 200 344 160 350 Z" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <!-- Ondas -->
  <path d="M 160 190 Q 300 182 440 190" fill="none" stroke="#be185d" stroke-width="1.2" opacity="0.6"/>
  <path d="M 160 230 Q 300 222 440 230" fill="none" stroke="#be185d" stroke-width="1.2" opacity="0.6"/>
  <path d="M 160 270 Q 300 262 440 270" fill="none" stroke="#be185d" stroke-width="1.2" opacity="0.6"/>
  <path d="M 160 310 Q 300 302 440 310" fill="none" stroke="#be185d" stroke-width="1.2" opacity="0.6"/>
  <!-- Ventana / visor -->
  <rect x="270" y="230" width="60" height="45" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="300" y="290" font-size="9" fill="#0284c7" text-anchor="middle">VISOR</text>
  <!-- Embocaduras -->
  <rect x="128" y="130" width="22" height="240" fill="#f1f5f9" stroke="#0f172a" stroke-dasharray="4,2"/>
  <rect x="450" y="130" width="22" height="240" fill="#f1f5f9" stroke="#0f172a" stroke-dasharray="4,2"/>
  <text x="139" y="125" font-size="9" fill="#475569" text-anchor="middle">EMBOC.</text>
  <text x="461" y="125" font-size="9" fill="#475569" text-anchor="middle">EMBOC.</text>
  <!-- Cajón motor -->
  <rect x="150" y="112" width="300" height="18" fill="#475569"/>
  <text x="300" y="125" font-size="9" fill="#ffffff" text-anchor="middle">CAJÓN / EJE MOTOR</text>
  <!-- Células de seguridad -->
  <circle cx="185" cy="365" r="5" fill="#f59e0b"/>
  <circle cx="415" cy="365" r="5" fill="#f59e0b"/>
  <text x="300" y="370" font-size="9" fill="#b45309" text-anchor="middle">CÉLULAS DE SEGURIDAD</text>

  <!-- Cotas -->
  <line x1="150" y1="395" x2="450" y2="395" stroke="#e11d48" stroke-width="1.5"/>
  <polygon points="150,395 158,391 158,399" fill="#e11d48"/>
  <polygon points="450,395 442,391 442,399" fill="#e11d48"/>
  <rect x="270" y="380" width="60" height="22" fill="#fff1f2" stroke="#be123c" stroke-width="2" rx="4"/>
  <text x="300" y="395" font-size="10" fill="#be123c" text-anchor="middle">ANCHO</text>

  <line x1="490" y1="130" x2="490" y2="370" stroke="#e11d48" stroke-width="1.5"/>
  <polygon points="490,130 486,138 494,138" fill="#e11d48"/>
  <polygon points="490,370 486,362 494,362" fill="#e11d48"/>
  <rect x="500" y="236" width="60" height="22" fill="#fff1f2" stroke="#be123c" stroke-width="2" rx="4"/>
  <text x="530" y="251" font-size="10" fill="#be123c" text-anchor="middle">ALTO</text>

  <!-- Tabla de campos -->
  <g font-size="11" fill="#0f172a">
    <text x="20" y="145">ANCHO TOTAL LONA (mm)</text><rect x="200" y="132" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="170">ALTO TOTAL LONA (mm)</text><rect x="200" y="157" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="195">ANCHO ENTRE GUIAS (mm)</text><rect x="200" y="182" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="220">ALTO ENTRE SUELO Y Cajón (mm)</text><rect x="200" y="207" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="245">TIPO DE LONA</text><rect x="200" y="232" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="245" font-size="8" fill="#64748b"> </text>
    <text x="340" y="170" font-size="9" fill="#64748b">(alta frecuencia / anticorte /</text>
    <text x="340" y="181" font-size="9" fill="#64748b">autoportante / refrigeración)</text>
    <text x="20" y="270">GROSOR LONA (mm)</text><rect x="200" y="257" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="295">COLOR LONA</text><rect x="200" y="282" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="320">Nº VENTANILLAS + MEDIDA</text><rect x="200" y="307" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
    <text x="20" y="345">EMBOCADURA IZQ / DER (mm)</text><rect x="200" y="332" width="120" height="18" fill="#fdf2f8" stroke="#be185d"/>
  </g>
  <text x="20" y="410" font-size="10" fill="#0f172a">OBSERVACIONES:</text>
  <rect x="130" y="398" width="450" height="18" fill="#eef6ff" stroke="#0284c7"/>
</svg>
