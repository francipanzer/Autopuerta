<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Aprobación de presupuesto</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
    .wrap{max-width:720px;margin:0 auto;padding:16px}
    .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(15,23,42,.08);margin-bottom:14px}
    h1{font-size:20px;margin:0 0 4px}
    h2{font-size:16px;margin:0 0 10px}
    .muted{color:#64748b;font-size:13px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px 6px;border-bottom:1px solid #e2e8f0;text-align:left}
    th.n,td.n{text-align:right;white-space:nowrap}
    .totals{text-align:right;margin-top:10px;line-height:1.7}
    .totals strong{font-size:18px}
    label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
    input[type=text],textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
    canvas{width:100%;height:150px;border:1px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none;display:block}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#22c55e,#15803d)}
    .btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
    .btn.small{min-height:36px;padding:6px 12px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .actions .btn{flex:1 1 180px}
    .msg{text-align:center;padding:30px 12px}
    .msg .icon{font-size:44px}
    .error{color:#b91c1c;font-size:14px;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="card msg">Cargando presupuesto…</div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/public-config.js"></script>
  <script src="js/aprobar.js?v=2"></script>
</body>
</html>
